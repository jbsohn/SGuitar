name: Build SGuitar.xcframework

on:
  push:
    tags:
      - 'v*'  # Trigger only when you push a version tag like v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-xcframework:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        run: brew install cmake

      - name: Configure SGuitar for iOS
        run: |
          cmake -S . -B build -G Xcode -Wno-dev -DIOS=1

      - name: Build SGuitar Framework
        run: |
          cmake --build build --config Release

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -framework build/Release-iphoneos/SGuitar.framework \
            -output build/SGuitar.xcframework

      - name: Zip XCFramework for release
        run: |
          cd build
          zip -r SGuitar.xcframework.zip SGuitar.xcframework

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/SGuitar.xcframework.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
