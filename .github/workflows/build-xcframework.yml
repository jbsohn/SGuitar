name: Build SGuitar.xcframework

on:
  push:
    tags:
      - 'v*'  # Trigger only when you push a version tag like v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-xcframework:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        run: brew install cmake

      - name: Configure project with CMake (Xcode project)
        run: |
          cmake -S . -B build -G Xcode -DIOS=1

      - name: Build SGuitar.framework (iPhoneOS)
        run: |
          xcodebuild \
            -project build/SGuitar.xcodeproj \
            -scheme SGuitar \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            BUILD_DIR=build/iphoneos

      - name: Build SGuitar.framework (iPhoneSimulator)
        run: |
          xcodebuild \
           -project build/SGuitar.xcodeproj \
           -scheme SGuitar \
           -configuration Release \
           -sdk iphonesimulator \
           -arch x86_64 -arch arm64 \
           BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
           BUILD_DIR=build/iphonesimulator

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -framework build/Release-iphoneos/SGuitar.framework \
            -framework build/Release-iphonesimulator/SGuitar.framework \
            -output build/SGuitar.xcframework

      - name: Zip XCFramework for release
        run: |
          zip -r build/SGuitar.xcframework.zip build/SGuitar.xcframework

          - name: Upload to GitHub Release
            uses: softprops/action-gh-release@v2
            with:
              files: build/SGuitar.xcframework.zip
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
